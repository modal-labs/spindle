[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-spindle"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.34",
    "modal>=1.6.3",
    "numpy>=1.26",
    "protobuf>=5.29",
    "pydantic>=2.13.4",
    "stitch @ git+https://github.com/modal-projects/stitch.git@d9f681fd894b02257da129ec3483a977659cd7ab",
    "tinker>=0.26.0",
    "uvicorn>=0.52.0",
    "xxhash>=3.8.1",
    "zstandard>=0.25.0",
    "questionary>=2.1",
]

[tool.setuptools.dynamic]
version = { attr = "spindle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spindle = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/spindle/router" = ["rust/router/Cargo.toml", "rust/router/Cargo.lock", "rust/router/pyproject.toml"]
"share/spindle/router/src" = ["rust/router/src/lib.rs", "rust/router/src/native.rs", "rust/router/src/cache_wait.rs"]

[tool.ruff]
extend-exclude = ["*.md", "src/spindle/proto/*_pb2.py"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "EXE",
    "F",
    "FURB",
    "G",
    "ISC",
    "LOG",
    "PIE",
    "PLE",
    "RUF006",
    "RUF043",
    "TRY400",
    "UP",
    "ANN",
]
ignore = [
    "ASYNC109",
    "ASYNC110",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Files written before ANN was enforced. Remove a file once its functions are typed.
"examples/codeforces-codegolf/codegolf/app.py" = ["ANN"]
"examples/codeforces-codegolf/codegolf/cli.py" = ["ANN"]
