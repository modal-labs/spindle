[tool.ty.src]
include = ["src", "reference_runs"]
exclude = ["src/spindle/proto/*_pb2.py"]

[tool.ty.analysis]
# Packages that aren't installed in the dev environment.
allowed-unresolved-imports = [
    "megatron.**",
    "miles.**",
    "miles_plugins.**",
    "psutil.**",
    "ray.**",
    "sglang.**",
    "spindle_router.**",
    "torch.**",
]

[tool.ty.rules]
# Rules with existing violations; turn each back on once it's fixed.
call-non-callable = "ignore"
incompatible-attribute-override = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
invalid-type-form = "ignore"
lost-keyword-for-regular-parameter = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
redundant-condition = "ignore"
unsupported-operator = "ignore"
unused-ignore-comment = "ignore"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "jinja2>=3.1.6",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "ruff==0.16.6",
    "ty==0.0.100",
]

[project.scripts]
spindle = "spindle.deployment_cli:main"
