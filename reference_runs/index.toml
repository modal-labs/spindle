notes = "Completed 20-update stock-Tinker execution. Server commit/version were captured from get_server_capabilities before cleanup; four critical runtime file hashes matched that commit on all four GPU containers. Trainer Miles revision and H200 allocation were verified inside the executing containers. Sampler image sglang-v0.5.23-c4182b2 overlays fork c4182b22139a5730c9f18907cc0b178a305bb0f1 onto its upstream base. Cached base-weight snapshot: 37561816e66b5b9153b1b64c10968c18c1e6f4a0. Initial model download and client creation are excluded from recorded time; first-step compilation and subsequent warmup are included. All updates were accepted with finite metrics; evaluations completed at 0/5/10/15/20, publications at 0 through 20, checkpoints saved at 0/10/20. Held-out accuracy: 65/256 to 137/256. Median interval 559.4 seconds; total recorded time 13809.8 seconds. One workload seed; checkpoints saved, not restored. Compiler caches used the shared volume. This execution predates the new tooling PR and does not validate its head end to end."

[[runs]]
id = "dapo-qwen38-27b-miles-v020-resumed"
validation = "dapo_qwen38_27b_multinode"
output = "outputs/dapo-qwen38-27b-miles-v020-resumed.jsonl"
spindle_commit = "2b5cf4f13a6834bf680fbdaa3aa48329d961405b"
spindle_version = "0.1.7"
trainer_image = "miles-v0.2.0-8c5de26"
miles_commit = "8c5de2650a6876c2ca17ff221c7e0ba8a2d7b84a"
tinker_sdk = "0.26.0"
hardware = "Observed: two eight-H200 trainer nodes (TP2/CP8), two four-H200 samplers; 143771 MiB per GPU, driver 610.57.04. One training client and adapter slot."
region = "mixed"
notes = "Completed checkpoint-resumed trajectory: original updates 1-10 and recovered updates 11-20. The original client stopped after update 12; fresh workers restored checkpoint 10 and repeated updates 11-12. Original timestamps are retained, with no interval spanning the interruption (18 update intervals). Extra recovery evaluation/checkpoint work at step 10 is excluded from this comparison. Original trainers were in us-east and samplers in mx; recovery trainers were in us-south and samplers in us-west. Run-only Triton/Inductor caches were local to trainer nodes, not recipe defaults. The two segments have identical recorded workload settings and use shared stock-Tinker sampling/grading/datum functions. The frozen server source predates the final PR head. Server identity comes from captured capabilities; Miles revision and six runtime source files were checked in executing containers. Sampler image: sglang-v0.5.23-c4182b2. Checkpoint 10 restored weights and optimizer state bit for bit (1249 entries, including 833 optimizer entries). Post-run momentum-only Adam replay and publication/sample completed separately from measured timings. Its 1249 state entries, including 833 optimizer entries, match bit for bit between replayed steps. A nonzero-gradient replay was numerically unstable despite exact restored state; the momentum-only check isolates optimizer restoration from backward numerical variation. One seed with mixed regions; not a controlled performance comparison."

[[runs]]
id = "beam-blog-repro-miles-v012"
validation = "beam_blog_repro"
output = "outputs/beam-blog-repro-miles-v012.jsonl"
spindle_commit = "2a0a9611bde3966b63b4827a9b5ef6687fb288b4"
trainer_image = "Miles v0.1.2 with Beam support"
miles_commit = "6f5a4a8429e4f57a65a7251facb7d3d9faf0b3ff"
tinker_sdk = "0.26.0"
hardware = "Two eight-H200 trainer nodes; one eight-B300 sampler replica."
notes = '''
Historical execution. Field names were converted to the catalog output format with
values unchanged: accuracy -> reward, mean_tokens -> response_tokens_mean,
completions -> responses, token_limit_fraction -> truncated_fraction, and capped
divided by responses -> truncated_fraction. Update responses (32 groups x 8) and
seconds_since_previous_update (from consecutive update times) were added. It
predates this TOML catalog and the miles-v0.2.0 recipe; it validates only the runtime pins recorded
here. Trainer SGLang 9ac1c65b, sampler SGLang 991fb37566. The server ran at Spindle
2a0a961 and was redeployed at 94edd89 with identical src/. Client source was the
reference-run script at 6bcf5aa through update 10 and 35f365f afterward.
The run stopped at 42 accepted updates of the planned 100. Update 43 finished
backward and was cancelled before optimizer submission. The update-10 cold restart
matched all 1,664 adapter, master and Adam tensors at optimizer step 10.
AIME25 (30 problems, eight samples, 4,096-token cap): 97/240 (40.42%) initially,
154/240 (64.17%) at update 40, the latest complete evaluation. Mean response tokens:
3,180.54 -> 2,492.28. Paired-problem 95% bootstrap interval for the change: +12.92
to +35.83 points; an intermediate comparison, not the planned update-100 test.
Independent strict regrading agreed with all 2,160 local responses.
Median seconds: native forward/backward 449.40, trainer API wall time 513.19,
between accepted updates 621.90 (including the planned cold restart). Wall time
through the stop: 10.90 hours.
The metrics hold aggregates and accuracy per problem; no prompts, answers, labels
or routing payloads. Plot with the published Beam LoRA curve:
uv run --with matplotlib==3.11.2 python reference_runs/scripts/beam_blog_repro.py \
  --output reference_runs/outputs/beam-blog-repro-miles-v012.jsonl --plot-only
'''

[[runs]]
id = "beam-blog-digitized"
validation = "beam_blog_repro"
output = "outputs/beam-blog-digitized.jsonl"
source = "https://huggingface.co/blog/reflection-beam#train-with-lora"
notes = '''
Not a Spindle execution and not raw run data: an approximate manual digitization of
the published Beam LoRA chart, kept to overlay on Beam executions. Evaluation
records hold AIME25 accuracy as reward and mean response tokens. The published
evaluation-step axis is not verified to count optimizer updates, and the exact
invocation, hardware and orchestration are unavailable. The overlay is descriptive;
do not infer matched learning speed or parity. The published endpoint is 64.2%
accuracy and 2,197 mean response tokens.
'''

