name: Build runtime image candidate

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Source project to build
        type: choice
        options: [miles, sglang]
        required: true
      source_commit:
        description: Full commit SHA in the modal-projects fork
        type: string
        required: true
      base_image:
        description: Digest-pinned SGLang base (Miles) or CUDA 13.0.3 devel base (SGLang)
        type: string
        required: true
      uv_base:
        description: Digest-pinned astral-sh/uv image (SGLang only)
        type: string
      sglang_commit:
        description: Full sgl-project/sglang commit SHA (Miles only)
        type: string
      megatron_commit:
        description: Full radixark/Megatron-LM commit SHA (Miles only)
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-runtime-${{ inputs.engine }}-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, spindle-image-builder]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate source revision
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modal-projects/${{ inputs.engine }}
          ref: ${{ inputs.source_commit }}
          path: build-source
          submodules: recursive
          persist-credentials: false
      - name: Prepare pinned build inputs
        id: inputs
        env:
          ENGINE: ${{ inputs.engine }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BASE_IMAGE: ${{ inputs.base_image }}
          UV_BASE: ${{ inputs.uv_base }}
          SGLANG_COMMIT: ${{ inputs.sglang_commit }}
          MEGATRON_COMMIT: ${{ inputs.megatron_commit }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/images/prepare_build.py --context build-source \
            --engine "$ENGINE" --commit "$SOURCE_COMMIT" --base "$BASE_IMAGE" \
            --uv-base "$UV_BASE" --sglang-commit "$SGLANG_COMMIT" \
            --megatron-commit "$MEGATRON_COMMIT" --github-output "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${IMAGE_OWNER,,}/spindle-runtimes/candidates/${ENGINE}:${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build-source
          file: build-source/docker/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.inputs.outputs.image }}
          build-args: ${{ steps.inputs.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.spindle.runtime.source=https://github.com/modal-projects/${{ inputs.engine }}
            dev.spindle.runtime.revision=${{ inputs.source_commit }}
      - name: Record candidate digest
        env:
          IMAGE: ${{ steps.inputs.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > candidate-image.txt
          cat candidate-image.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate only. Run GPU compatibility checks before changing deployment pins.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-image-candidate
          path: |
            build-inputs.json
            candidate-image.txt
            build-source/docker/Dockerfile
          if-no-files-found: error
